<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>謎解きラリー Enter</title>

<style>
  :root{
    --bg:#171b22;
    --panel:#222a35;
    --panel2:#2b3543;
    --text:#f7f8fa;
    --muted:#bac4d1;
    --accent:#79ddff;
    --danger:#ffaaaa;
    --ok:#a2f3bd;
    --line:#414d5e;
  }

  * {
    box-sizing:border-box;
  }

  body{
  margin:0;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 15% 15%, rgba(121,221,255,.13), transparent 32%),
    radial-gradient(circle at 85% 80%, rgba(121,221,255,.08), transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}

  .app{
  width:min(100%, 600px);
  flex:1 1 0;
  min-height:0;
  margin:0 auto;
  background:rgba(23,27,34,.94);
  display:flex;
  flex-direction:column;
}


  header{
    position:sticky;
    top:0;
    z-index:10;
    padding:17px 18px;
    border-bottom:1px solid var(--line);
    background:rgba(23,27,34,.97);
    backdrop-filter:blur(12px);
  }

  .title{
    font-size:18px;
    font-weight:700;
    letter-spacing:.04em;
  }

  .status{
    margin-top:5px;
    font-size:13px;
    color:var(--muted);
  }

#chat{
  flex:1;
  min-height:0;
  padding:20px 16px 20px;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

  .row{
    display:flex;
    margin:14px 0;
    animation:pop .2s ease-out both;
  }

  .row.system{
    justify-content:flex-start;
  }

  .row.user{
    justify-content:flex-end;
  }

  .bubble{
    width:fit-content;
    max-width:94%;
    padding:13px 16px;
    line-height:1.8;
    border-radius:17px;
    font-size:16px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:normal;
  }

  .system .bubble{
    background:var(--panel2);
    border:1px solid var(--line);
    border-bottom-left-radius:5px;
  }

  .user .bubble{
    background:#19445a;
    border:1px solid #39718d;
    border-bottom-right-radius:5px;
  }

  .bubble.error{
    border-color:#855050;
    background:#402629;
  }

  .bubble.success{
    border-color:#477c59;
    background:#244331;
  }

  .speaker{
    font-size:13px;
    color:var(--muted);
    margin:0 0 6px 5px;
  }

  .bubble a{
    color:var(--accent);
    text-decoration:underline;
    text-underline-offset:3px;
    overflow-wrap:anywhere;
  }

  .site-link{
    display:block;
    margin-top:12px;
    padding:13px 15px;
    border:1px solid #52758a;
    border-radius:12px;
    background:#192b38;
    color:var(--accent);
    text-decoration:none !important;
    line-height:1.6;
  }

  .site-link strong{
    display:block;
    font-size:16px;
    margin-bottom:4px;
  }

  .site-link span{
    display:block;
    font-size:13px;
    color:#c3d9e6;
  }

  .composer-wrap{
  position:relative;
  width:100%;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:#171b22;
  border-top:1px solid var(--line);
}

  .composer{
    display:flex;
    gap:9px;
    align-items:center;
  }

  input{
    flex:1;
    min-width:0;
    height:50px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#202630;
    color:var(--text);
    padding:0 15px;
    font-size:16px;
    outline:none;
  }

  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(121,221,255,.12);
  }

  button{
    height:50px;
    padding:0 19px;
    border:0;
    border-radius:14px;
    background:var(--accent);
    color:#07151c;
    font-weight:800;
    cursor:pointer;
    font-size:15px;
  }

  button:disabled{
    opacity:.45;
    cursor:default;
  }

  .hint{
    margin-top:9px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }

  @keyframes pop{
    from{opacity:0; transform:translateY(5px)}
    to{opacity:1; transform:translateY(0)}
  }

  @media (min-width:700px){
  body{
    padding:24px 0;
  }

  .app{
    flex:1 1 0;
    min-height:0;
    border:1px solid var(--line);
    border-radius:24px 24px 0 0;
    overflow:hidden;
    box-shadow:0 28px 80px rgba(0,0,0,.35);
  }

  .composer-wrap{
    position:relative;
    bottom:auto;
    width:min(100%, 600px);
    flex-shrink:0;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    border-bottom-left-radius:24px;
    border-bottom-right-radius:24px;
  }
}

   .composer-wrap{
  position:relative;
  bottom:auto;
  width:100%;
  border-left:0;
  border-right:0;
  border-radius:0;
}
  }
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="title">Dischat 荼毘</div>
    <div class="status">ブラウザ / スマホ対応</div>
  </header>

  <main id="chat" aria-live="polite"></main>
</div>

<div class="composer-wrap">
  <form class="composer" id="answerForm">
    <input
      id="answer"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="入力"
      aria-label="答え"
    >
    <button id="sendBtn" type="submit">送信</button>
  </form>

  <div class="hint">
    答えを入力してください。間違うと荼毘からヒントがあるかも。
  </div>
</div>

<script>
  // ===== 内容の設定 =====

  const ACCEPTED_ANSWERS = [
    "デトネラット社",
    "デトネラット",
    "でとねらっと",
    "でとねらっと社",
    "Detnerat Company",
    "Detnerat",
    "DETNERAT",
　"DETNERAT社"
  ];

  const INTRO_MESSAGES = [
    "ナンバーツー、調べてほしいことがある",
    "群訝山荘って山ン中にある宿だ",
    "管理会社の名前わかるか？"
  ];

  const WRONG_REPLIES = [
    "資産のある会社だよ、代表の笑顔が胡散臭いよな。お前みたいにさ",
    "まだわかんねェのか？　羽を伸ばしすぎだ、プロヒーロー",
    "じらすなよ、もう掴んでんだろ？　Dで始まる寿司を……あァ、サポートアイテム会社だったか？",
    "いつまで無駄な会話を続けるつもりだ。俺と喋るなら後にしてくれ。【荼毘ヒント】の方が会話パターンが多い"
  ];

  const CORRECT_REPLY =
    "ご苦労さま。その【デトネラット社】の調査を頼む";

  // 特定の言葉に反応する台詞
  // word：反応する言葉
  // reply：返す台詞
  //
  // 上から順番に判定します。
  // 複数の言葉が含まれている場合は、最初に一致した台詞が出ます。

  const KEYWORD_REPLIES = [
    {
      word: "群訝山荘",
      reply: "ああ、群訝山荘だ。今度、旅行するんだよ"
    },
    {
      word: "ホークス",
      reply: "そういやお前、本名を公表してねえんだな。親しみが湧くよ"
    },
    {
      word: "荼毘",
      reply: "お前からの頼みは聞けねえな。まずは調べてくれよ"
    },
    {
      word: "羽",
      reply: "お前の羽を誰よりも上手く使ってやる"
    },
    {
      words: ["デトラネット", "デトラネット社"],
      reply: "間違えたまま覚えて正すことができねえ奴っているよな"
    },
    {
      words: ["데트네랏사", "데트네랏", "迪特内拉特公司", "迪特内拉特"],
      reply: "日本語と英語しかできねえんだ。ごめんな"
    }

  ];

  // ============================================

  const chat = document.getElementById("chat");
  const form = document.getElementById("answerForm");
  const input = document.getElementById("answer");
  const sendBtn = document.getElementById("sendBtn");

  let isCleared = false;

  function normalize(text){
    return text
      .trim()
      .toLowerCase()
      .normalize("NFKC")
      .replace(/\s+/g, "");
  }

  function addBubble(text, type="system", state=""){
    const row = document.createElement("div");
    row.className = `row ${type}`;

    const wrap = document.createElement("div");

    if(type === "system"){
      const speaker = document.createElement("div");
      speaker.className = "speaker";
      speaker.textContent = "荼毘";
      wrap.appendChild(speaker);
    }

    const bubble = document.createElement("div");
    bubble.className = `bubble ${state}`;
    bubble.textContent = text;

    wrap.appendChild(bubble);
    row.appendChild(wrap);
    chat.appendChild(row);

    scrollToBottom();
  }

  function scrollToBottom(){
    requestAnimationFrame(() => {
      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });
    });
  }

  function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function showIntro(){
    for(const msg of INTRO_MESSAGES){
      await wait(450);
      addBubble(msg);
    }
  }

  // 正解後のリンク付きメッセージ
  function showSuccessLink(){
    const row = document.createElement("div");
    row.className = "row system";

    const wrap = document.createElement("div");

    const speaker = document.createElement("div");
    speaker.className = "speaker";
    speaker.textContent = "荼毘";

    const bubble = document.createElement("div");
    bubble.className = "bubble success";

    bubble.appendChild(
      document.createTextNode("このサイトを調べてくれ。期待してるよ")
    );

    const link = document.createElement("a");
    link.className = "site-link";
    link.href = "https://nekonoshita1228.github.io/-/index.html";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const strong = document.createElement("strong");
    strong.textContent = "群訝山荘｜公式サイトはこちら！";

    const detail = document.createElement("span");
    detail.textContent = "荼ホ謎解きラリー START";

    link.appendChild(strong);
    link.appendChild(detail);

    bubble.appendChild(link);

    const description = document.createElement("p");
    description.textContent =
      "５名の荼ホ５作品を巡って、群訝山荘の謎を解き明かそう！";
    description.style.margin = "12px 0 0";

    bubble.appendChild(description);

    wrap.appendChild(speaker);
    wrap.appendChild(bubble);
    row.appendChild(wrap);
    chat.appendChild(row);

    scrollToBottom();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const raw = input.value;
    if(!raw.trim()) return;

    addBubble(raw, "user");

    input.value = "";
    sendBtn.disabled = true;
    input.disabled = true;

    await wait(450);

    const answer = normalize(raw);

    // すでに正解している場合
    if(isCleared){
      addBubble(
        "もう調査は始まってる。さっさと行け",
        "system"
      );

      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
      return;
    }

    // 正解判定
      const isCorrect = ACCEPTED_ANSWERS.some(
  a => answer.includes(normalize(a))
);
    if(isCorrect){
      isCleared = true;

      addBubble(CORRECT_REPLY, "system", "success");

      await wait(450);

      showSuccessLink();

      input.placeholder = "CLEAR";
      input.disabled = true;
      sendBtn.disabled = true;
      return;
    }

    // キーワード判定
    const matchedKeyword = KEYWORD_REPLIES.find(item => {
      // word（単語1つ）と words（複数候補）の両方に対応
      const keywords = item.words || [item.word];
      return keywords.some(word =>
        normalize(raw).includes(normalize(word))
      );
    });

    if(matchedKeyword){
      addBubble(matchedKeyword.reply);

      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
      return;
    }

    // どれにも当てはまらない場合
    const reply =
      WRONG_REPLIES[
        Math.floor(Math.random() * WRONG_REPLIES.length)
      ];

    addBubble(reply, "system", "error");

    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  });

  showIntro();
</script>
</body>
</html>
